name: bestcrow-enterprise

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_PROGRAM_ID: ${BESTCROW_PROGRAM_ID:-3jGgPRa4gH25wfL49E3TAtpix5ePUZKWrQLT83eNZBVr}
        NEXT_PUBLIC_PAYMENT_MODE: ${NEXT_PUBLIC_PAYMENT_MODE:-mock}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: bestcrow-frontend:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: bestcrow-backend:latest
    environment:
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      SOLANA_RPC_PRIMARY_URL: ${SOLANA_RPC_PRIMARY_URL:-https://api.devnet.solana.com}
      SOLANA_RPC_FALLBACK_URL: ${SOLANA_RPC_FALLBACK_URL:-https://api.testnet.solana.com}
      BESTCROW_PROGRAM_ID: ${BESTCROW_PROGRAM_ID:-3jGgPRa4gH25wfL49E3TAtpix5ePUZKWrQLT83eNZBVr}
      DB_PATH: /app/data/bestcrow.db
      INDEXER_ENABLED: ${INDEXER_ENABLED:-true}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-15000}
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend_data:
