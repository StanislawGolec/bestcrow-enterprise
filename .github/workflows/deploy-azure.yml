name: Continuous Deployment to Azure Container Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images to Azure Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: bestcrowacr1104.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            bestcrowacr1104.azurecr.io/bestcrow-backend:${{ github.sha }}
            bestcrowacr1104.azurecr.io/bestcrow-backend:latest

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://bestcrow-backend.thankfulwave-5a41557f.polandcentral.azurecontainerapps.io
            NEXT_PUBLIC_PAYMENT_MODE=mock
          tags: |
            bestcrowacr1104.azurecr.io/bestcrow-frontend:${{ github.sha }}
            bestcrowacr1104.azurecr.io/bestcrow-frontend:latest

      - name: Deployment Summary
        run: |
          echo "### Deployment Status: Images Built & Pushed to ACR" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`bestcrowacr1104.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image:** \`bestcrowacr1104.azurecr.io/bestcrow-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image:** \`bestcrowacr1104.azurecr.io/bestcrow-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Ingress:** https://bestcrow-backend.thankfulwave-5a41557f.polandcentral.azurecontainerapps.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Ingress:** https://bestcrow-frontend.thankfulwave-5a41557f.polandcentral.azurecontainerapps.io" >> $GITHUB_STEP_SUMMARY
