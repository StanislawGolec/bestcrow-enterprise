name: Continuous Deployment to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Backend Image in ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image bestcrow-backend:${{ github.sha }} \
            --image bestcrow-backend:latest \
            -f docker/Dockerfile.backend .

      - name: Deploy Backend to Container App
        run: |
          az containerapp update \
            --name bestcrow-backend \
            --resource-group rg-bestcrow \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-backend:${{ github.sha }}

      - name: Resolve Backend Ingress URL
        id: backend_url
        run: |
          FQDN=$(az containerapp show --name bestcrow-backend --resource-group rg-bestcrow --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> $GITHUB_OUTPUT

      - name: Build Frontend Image in ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image bestcrow-frontend:${{ github.sha }} \
            --image bestcrow-frontend:latest \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.backend_url.outputs.url }} \
            --build-arg NEXT_PUBLIC_PAYMENT_MODE=mock \
            -f docker/Dockerfile.frontend .

      - name: Deploy Frontend to Container App
        run: |
          az containerapp update \
            --name bestcrow-frontend \
            --resource-group rg-bestcrow \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-frontend:${{ github.sha }}
