name: Continuous Deployment to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-backend:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-backend:latest

      - name: Deploy Backend to Container App
        run: |
          az containerapp update \
            --name bestcrow-backend \
            --resource-group rg-bestcrow \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-backend:${{ github.sha }}

      - name: Resolve Backend Ingress URL
        id: backend_url
        run: |
          FQDN=$(az containerapp show --name bestcrow-backend --resource-group rg-bestcrow --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.backend_url.outputs.url }}
            NEXT_PUBLIC_PAYMENT_MODE=mock
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-frontend:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-frontend:latest

      - name: Deploy Frontend to Container App
        run: |
          az containerapp update \
            --name bestcrow-frontend \
            --resource-group rg-bestcrow \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/bestcrow-frontend:${{ github.sha }}
