global:
  environment: production
  domain: bestcrow.io

frontend:
  replicaCount: 3
  image:
    repository: bestcrow-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5

backend:
  replicaCount: 2
  image:
    repository: bestcrow-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /api/health
      initialDelaySeconds: 5
      periodSeconds: 5
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.bestcrow.io
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: bestcrow-tls-cert
      hosts:
        - app.bestcrow.io

config:
  solanaRpcPrimaryUrl: "https://api.devnet.solana.com"
  solanaRpcFallbackUrl: "https://api.testnet.solana.com"
  programId: "3jGgPRa4gH25wfL49E3TAtpix5ePUZKWrQLT83eNZBVr"
  cluster: "devnet"
  indexerEnabled: "true"
  indexerPollIntervalMs: "15000"
